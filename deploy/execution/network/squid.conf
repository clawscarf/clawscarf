http_port 3128
max_filedescriptors 4096
cache_mem 16 MB
netdb_filename none
acl browser src "/etc/squid/browser-source.acl"
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
# Destination ACLs resolve hostnames before matching every returned address.
acl resolved_public_family dst 0.0.0.0/1 128.0.0.0/1 2000::/3
acl nonpublic dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 2001::/23 2001:db8::/32 2002::/16 3fff::/20
http_access deny manager
http_access deny !browser
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !resolved_public_family
http_access deny nonpublic
http_access allow browser
http_access deny all
cache deny all
access_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
pinger_enable off
visible_hostname clawscarf-browser-egress
shutdown_lifetime 0 seconds
forwarded_for delete
via on
