name: Build release candidate
run-name: Build ClawScarf ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable version (for example 0.1.0-alpha.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm access:plugin:setup && pnpm connectors:plugin:setup
      - run: pnpm check && pnpm build
      - run: CLAWSCARF_TEST_OPERATOR_ARCHIVE=1 node --import tsx --test scripts/package-operator.test.ts
  images:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: depot-ubuntu-24.04-arm-16
          - arch: amd64
            runner: depot-ubuntu-24.04-16
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stop the runner's older Docker engine
        run: sudo systemctl stop docker.service docker.socket
      - name: Set up Docker 29
        id: docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.5.3
      - name: Expose the test engine at the standard local socket
        env:
          DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
        run: sudo ln -sf "${DOCKER_SOCKET#unix://}" /var/run/docker.sock
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: bash scripts/release/build-images.sh .local/release-images
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
      - name: Verify installation on Linux Docker
        run: CLAWSCARF_TEST_PLATFORM_IMAGES=.local/release-images/images.json node --import tsx --test tests/deployment/platform-live.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-images-${{ matrix.arch }}
          path: |
            .local/release-images/images.json
            .local/release-images/network-sources.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  manifests:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-images-*
          path: images
      - name: Publish multi-architecture image indexes
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir combined
          echo '{}' > combined/images.json
          for name in $(jq -r 'keys[]' images/runtime-images-arm64/images.json); do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/$name:build-$GITHUB_RUN_ID"
            arm="$(jq -er --arg name "$name" '.[$name]' images/runtime-images-arm64/images.json)"
            amd="$(jq -er --arg name "$name" '.[$name]' images/runtime-images-amd64/images.json)"
            docker buildx imagetools create -t "$image" "$arm" "$amd"
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er .digest)"
            jq --arg name "$name" --arg image "${image%:*}@$digest" '. + {($name): $image}' combined/images.json > combined/next.json
            mv combined/next.json combined/images.json
          done
          cp images/runtime-images-arm64/network-sources.tgz combined/network-sources.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-images
          path: combined/
          if-no-files-found: error
  package:
    needs: manifests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-images
          path: .local/release-images
      - run: pnpm install --frozen-lockfile
      - run: pnpm access:plugin:setup && pnpm connectors:plugin:setup
      - run: pnpm build
      - name: Assemble the exact runtime and npm package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --import tsx scripts/release/candidate.ts --version "$RELEASE_VERSION" --images .local/release-images/images.json --output .local/candidate
          cp .local/release-images/network-sources.tgz .local/candidate/
          cd .local/candidate
          shasum -a 256 network-sources.tgz >> SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          npm install --global --prefix "$RUNNER_TEMP/clawscarf" --ignore-scripts "./clawscarf-cli-$RELEASE_VERSION.tgz"
          "$RUNNER_TEMP/clawscarf/bin/clawscarf" --help
          "$RUNNER_TEMP/clawscarf/bin/clawscarf" recipes --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-candidate
          path: .local/candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  standalone:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: linux-arm64
            runner: depot-ubuntu-24.04-arm-16
          - platform: linux-x64
            runner: depot-ubuntu-24.04-16
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-candidate
          path: .local/candidate
      - run: pnpm install --frozen-lockfile
      - name: Package and test the standalone CLI without system Node
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          node --import tsx scripts/release/standalone.ts --archive ".local/candidate/clawscarf-cli-$RELEASE_VERSION.tgz" --output .local/standalone
          CLAWSCARF_TEST_STANDALONE_ARCHIVE=1 CLAWSCARF_STANDALONE_ARCHIVE=".local/standalone/clawscarf-$RELEASE_VERSION-$PLATFORM.tgz" node --import tsx --test scripts/package-standalone.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-${{ matrix.platform }}
          path: .local/standalone/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  candidate:
    needs: standalone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-candidate
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          merge-multiple: true
          path: candidate
      - name: Check and include tested standalone archives
        working-directory: candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          for platform in darwin-arm64 linux-arm64 linux-x64; do
            sha256sum "clawscarf-$RELEASE_VERSION-$platform.tgz" >> SHA256SUMS
          done
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
