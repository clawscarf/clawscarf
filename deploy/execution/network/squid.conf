http_port 3128
max_filedescriptors 4096
cache_mem 16 MB
netdb_filename none
acl browser src "/etc/squid/browser-source.acl"
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
# Destination ACLs resolve hostnames before matching every returned address.
acl resolved_public_family dst "/etc/squid/public-families.acl"
acl nonpublic dst "/etc/squid/nonpublic.acl"
http_access deny manager
http_access deny !browser
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !resolved_public_family
http_access deny nonpublic
http_access allow browser
http_access deny all
cache deny all
access_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
pinger_enable off
visible_hostname clawscarf-browser-egress
shutdown_lifetime 0 seconds
forwarded_for delete
via on
