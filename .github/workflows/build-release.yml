name: Build release candidate
run-name: Build ClawScarf ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable version (for example 0.1.0-alpha.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm access:plugin:setup && pnpm connectors:plugin:setup
      - run: pnpm check && pnpm build
      - run: CLAWSCARF_TEST_OPERATOR_ARCHIVE=1 node --import tsx --test scripts/package-operator.test.ts
  images:
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: bash scripts/release/build-images.sh .local/release-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-images
          path: |
            .local/release-images/images.json
            .local/release-images/network-sources.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  package:
    needs: images
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-images
          path: .local/release-images
      - run: pnpm install --frozen-lockfile
      - run: pnpm access:plugin:setup && pnpm connectors:plugin:setup
      - run: pnpm build
      - name: Assemble the exact runtime and npm package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --import tsx scripts/release/candidate.ts --version "$RELEASE_VERSION" --images .local/release-images/images.json --output .local/candidate
          cp .local/release-images/network-sources.tgz .local/candidate/
          cd .local/candidate
          shasum -a 256 network-sources.tgz >> SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          npm install --global --prefix "$RUNNER_TEMP/clawscarf" --ignore-scripts "./clawscarf-cli-$RELEASE_VERSION.tgz"
          "$RUNNER_TEMP/clawscarf/bin/clawscarf" --help
          "$RUNNER_TEMP/clawscarf/bin/clawscarf" recipes --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: .local/candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
